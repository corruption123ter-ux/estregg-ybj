[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estregg-ybj"
version = "1.1.1"
description = "ESTREGG Space Exploration Terminal Game"
readme = "README.md"
requires-python = ">=3.8"
[project.optional-dependencies]
windows = ["windows-curses; platform_system=='Windows'"]

[project.scripts]
estregg = "estregg.game:main"
